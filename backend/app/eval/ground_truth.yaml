# Veyra pilot ground truth: strategic moves by the 3 seeded competitors, 2026-05-01 .. 2026-11-18.
#
# Labelling protocol (written down and frozen BEFORE the first replay was run):
#   * one event = one strategic move, dated by its decisive OFFICIAL announcement (company blog/changelog);
#     Airtable has no feed, so its event is dated by the first Wayback capture showing the change (+/- 1 month).
#   * every source_url was present in the frozen dataset (data/replay) when labelled.
#   * keywords name the strategic THEME a hypothesis must mention to count as a match; an entry "a+b"
#     requires both terms. Matching is case-insensitive substring on the hypothesis statement.
#   * labelled by one person (the project team, with an AI assistant drafting); a second reviewer should
#     check these before the numbers are quoted anywhere. Treat this as a pilot, not a benchmark.
